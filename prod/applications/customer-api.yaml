apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customer-api-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    sparrowx.io/category: applications
    sparrowx.io/app: customer-api
    sparrowx.io/environment: prod    
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: sparrowx-prod
  sources:
    - repoURL: https://github.com/SparrowX-Labs/Custom-Apps-HelmCharts.git
      targetRevision: main
      path: prod/application-helmchart
      helm:
        valueFiles:
          - $values/helm-values-prod.yaml
    - repoURL: https://github.com/SparrowX-Labs/customer-api.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
