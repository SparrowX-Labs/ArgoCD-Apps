
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sparrowx-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: SparrowX production environment

  sourceRepos:
    - 'https://github.com/SparrowX-Labs/*'

  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'

  # Allow platform resources, including cluster-scoped
  # resources required by Crossplane and other components.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

# Bootstrap the AppProject manually with kubectl before applying the root Application.

# The root Application references this project, so it must be created first

# bootstrap it with:
# kubectl apply -f prod/project.yaml