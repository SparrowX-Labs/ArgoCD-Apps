
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sparrowx-dev-applications
  namespace: argocd
  labels:
    sparrowx.io/category: root
spec:
  project: sparrowx-dev
  source:
    repoURL: https://github.com/SparrowX-Labs/ArgoCD-Apps.git
    targetRevision: main
    path: dev/applications
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: customer-api
      namespace: argocd
      jsonPointers:
        - /spec/sources/0/helm/parameters
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
