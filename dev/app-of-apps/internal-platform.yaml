
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sparrowx-dev-internal-platform
  namespace: argocd
  labels:
    sparrowx.io/category: root
spec:
  project: sparrowx-dev
  source:
    repoURL: https://github.com/SparrowX-Labs/ArgoCD-Apps.git
    targetRevision: main
    path: dev/internal-platform
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
