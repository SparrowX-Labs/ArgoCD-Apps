apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  labels:
    sparrowx.io/category: application
spec:
  project: sparrowx-dev
  source:
    repoURL: https://github.com/SparrowX-Labs/gateway-api.git
    targetRevision: main
    path: dev
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
