apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    sparrowx.io/category: application
    sparrowx.io/app: gateway-api
    sparrowx.io/environment: dev
spec:
  project: sparrowx-dev
  sources:
    - repoURL: https://github.com/SparrowX-Labs/Custom-Apps-HelmCharts.git
      targetRevision: main
      path: dev/gateway-api-helmchart
      helm:
        valueFiles:
          - $values/dev/*.yaml
    - repoURL: https://github.com/SparrowX-Labs/gateway-api.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
