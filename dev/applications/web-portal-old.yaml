apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-portal
  namespace: argocd
  labels:
    sparrowx.io/category: applications
    sparrowx.io/app: web-portal
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: sparrowx-dev
  sources:
    - repoURL: https://github.com/SparrowX-Labs/Custom-Apps-HelmCharts.git
      targetRevision: main
      path: dev/application-helmchart
      helm:
        valueFiles:
          - $values/helm-values-dev.yaml
    - repoURL: https://github.com/SparrowX-Labs/web-portal.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
